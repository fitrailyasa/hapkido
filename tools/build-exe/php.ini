; php.ini for the bundled PHP runtime (PHP 8.3 NTS x64, VS16).
;
; package.ps1 copies this file into runtime\php\php.ini. Paths are relative to
; the php.exe folder, so the whole runtime folder can be moved around.

engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
expose_php = Off

max_execution_time = 120
max_input_time = 120
memory_limit = 512M

; Errors go to runtime\php\logs\php-error.log, never to the browser.
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "logs\php-error.log"
ignore_repeated_errors = Off
html_errors = Off

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
default_charset = "UTF-8"
date.timezone = "Asia/Jakarta"

; Extensions required by Laravel 11 (SQLite database).
; Note: bcmath/dom/xmlreader/xmlwriter are built into PHP 8.3 NTS Windows —
; listing them here causes "Unable to load dynamic library" startup warnings.
extension_dir = "ext"
extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = zip

; CA bundle for HTTPS (composer, curl, openssl).
curl.cainfo = "cacert.pem"
openssl.cafile = "cacert.pem"

file_uploads = On
post_max_size = 20M
upload_max_filesize = 8M
max_file_uploads = 20
max_input_vars = 5000
default_socket_timeout = 60

session.auto_start = Off
session.gc_maxlifetime = 7200

; OPcache makes the first request of a long event much faster.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
