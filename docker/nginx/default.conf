# Nginx configuration for the Hapkido Laravel application.
#
# The container serves the compiled front-end assets from the shared volume
# and forwards every dynamic request to the PHP-FPM container.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The Laravel front controller lives in the public directory.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Write the access and the error log to the docker logs.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Compression for the text based responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never expose dot files such as .env or .git.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache the static assets for seven days.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI configuration for PHP.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }
}
